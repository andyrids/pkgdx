#:schema https://raw.githubusercontent.com/j178/prek/refs/heads/master/prek.schema.json

# BUILTIN REPO HOOKS

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-toml"
name = "Check TOML [Builtin]"

[[repos.hooks]]
id = "check-yaml"
name = "Check YAML [Builtin]"

[[repos.hooks]]
id = "detect-private-key"
name = "Detect PEM [Builtin]"

# LOCAL REPO HOOKS

[[repos]]
repo = "local"

# Use `pkgdevx.standards` config
[[repos.hooks]]
id = "format"
name = "Format [Ruff]"
entry = "uv run ruff format"
args = ["--config", "src/pkgdevx/standards/ruff.toml", "--exit-non-zero-on-format"]
language = "system"
types_or = ["python", "pyi"]
require_serial = true
pass_filenames = false

# Use `pkgdevx.standards` config
[[repos.hooks]]
id = "lint"
name = "Lint [Ruff]"
entry = "uv run ruff check"
args = ["--config", "src/pkgdevx/standards/ruff.toml", "--fix", "--exit-non-zero-on-fix"]
language = "system"
types_or = ["python", "pyi"]
require_serial = true
pass_filenames = false

# Use `pkgdevx.standards` config
[[repos.hooks]]
id = "typing"
name = "Typing [Mypy]"
entry = "uv run mypy"
args = ["-p", "pkgdevx", "--config-file", "src/pkgdevx/standards/mypy.ini"]
language = "system"
types_or = ["python", "pyi"]
exclude = "tests/"
require_serial = true
pass_filenames = false

# Use `pkgdevx.standards` config
[[repos.hooks]]
id = "markdown"
name = "Check Markdown [PyMarkdown]"
entry = "uv run pymarkdown"
args = ["--config", "src/pkgdevx/standards/pymarkdown.toml", "scan"]
language = "system"
types_or = ["markdown"]
require_serial = true
pass_filenames = true

[[repos.hooks]]
id = "secrets"
name = "Detect Secrets [detect-secrets]"
entry = "uv run detect-secrets-hook"
args = ["--baseline", ".secrets.baseline", "--no-verify"]
language = "system"
exclude = "(\\.secrets\\.baseline|.*\\.lock)"
require_serial = true
pass_filenames = true
stages = ["pre-commit"]
