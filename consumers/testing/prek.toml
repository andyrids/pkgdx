#:schema https://raw.githubusercontent.com/j178/prek/refs/heads/main/prek.schema.json

default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "https://gitlab.com/andyrids/pkgdx"
rev = "v0.14.0"

[[repos.hooks]]
id = "pkgdx-lint"
name = "Lint [Ruff]"

[[repos.hooks]]
id = "pkgdx-format"
name = "Format [Ruff]"

[[repos.hooks]]
id = "pkgdx-markdown"
name = "Check Markdown [PyMarkdown]"

[[repos.hooks]]
id = "pkgdx-secrets"
name = "Detect Secrets [detect-secrets]"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "pkgdx-typing"
name = "Typing [Mypy]"
entry = "uv run pkgdx-typing-hook"
language = "system"
types_or = ["python", "pyi"]
exclude = "tests/"
require_serial = true
pass_filenames = false
verbose = true

[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "check-toml"
name = "Check TOML [Builtin]"

[[repos.hooks]]
id = "check-yaml"
name = "Check YAML [Builtin]"

[[repos.hooks]]
id = "detect-private-key"
name = "Detect PEM [Builtin]"

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.5.0"

[[repos.hooks]]
id = "conventional-pre-commit"
name = "Commit [Conventional]"
args = []
