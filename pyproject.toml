[project]
name = "pkgdx"
dynamic = ["version"]
description = "A package to centralise standards across Python projects."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*", "COPYRIGHT"]
authors = [{ name = "Andrew Ridyard", email = "andyrids.culprit320@passmail.com" }]
maintainers = [{ name = "Andrew Ridyard", email = "andyrids.culprit320@passmail.com" }]
requires-python = ">=3.11"
keywords = ["DevEx", "CLI", "typing", "linting", "pre-commit"]
classifiers = [
    # 3 - Alpha | 4 - Beta | 5 - Production/Stable
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "detect-secrets>=1.5.0",
    "mypy>=2.1.0",
    "prek~=0.4.8",
    "pymarkdownlnt>=0.9.37",
    "rich>=15.0.0",
    "ruff>=0.15.20",
    "tomlkit>=0.15.0",
]

[dependency-groups]
dev = [
    "coverage>=7.14.1",
    "pytest>=9.1.1",
]

[project.scripts]
pkgdx = "pkgdx.__main__:main"
pkgdx-secrets-hook = "pkgdx.__main__:detect_secrets"
pkgdx-format-hook = "pkgdx.__main__:ruff_format"
pkgdx-lint-hook = "pkgdx.__main__:ruff_lint"
pkgdx-markdown-hook = "pkgdx.__main__:pymarkdown_lint"
pkgdx-typing-hook = "pkgdx.__main__:mypy_typing"

[project.urls]
Documentation = "https://gitlab.com/andyrids/pkgdx/blob/main/README.md"
Repository = "https://gitlab.com/andyrids/pkgdx"
Issues = "https://gitlab.com/andyrids/pkgdx/issues"
Changelog = "https://gitlab.com/andyrids/pkgdx/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# lets SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PKGDX work under hatch-vcs
dist_name = "pkgdx"
local_scheme = "no-local-version"
version_scheme = "guess-next-dev"

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/pkgdx"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
log_cli = true
log_cli_level = "INFO"
tmp_path_retention_policy = "failed"

[tool.coverage.run]
omit = ["tests/*", "*/src_test*/*"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.workspace]
members = [
    "consumers/testing",
]
