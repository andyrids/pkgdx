[project]
name = "pkgdevx"
dynamic = ["version"]
description = "A package to centralise standards across Python projects."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICEN[CS]E*", "COPYRIGHT"]
authors = [
    { name = "Andrew Ridyard", email = "andyrids.culprit320@passmail.com" },
]
requires-python = ">=3.10"
keywords = []
classifiers = [
    # 3 - Alpha | 4 - Beta | 5 - Production/Stable
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "detect-secrets>=1.5.0",
    "mypy>=2.1.0",
    "prek~=0.4.8",
    "pymarkdownlnt>=0.9.37",
    "rich>=15.0.0",
    "ruff>=0.15.20",
    "tomlkit>=0.15.0",
]

[dependency-groups]
dev = [
    "coverage>=7.14.1",
    "pytest>=9.1.1",
]

[project.scripts]
pkgdevx = "pkgdevx.__main__:main"
pkgdevx-secrets-hook = "pkgdevx.__main__:detect_secrets"
pkgdevx-format-hook = "pkgdevx.__main__:ruff_format"
pkgdevx-lint-hook = "pkgdevx.__main__:ruff_lint"
pkgdevx-markdown-hook = "pkgdevx.__main__:pymarkdown_lint"
pkgdevx-typing-hook = "pkgdevx.__main__:mypy_typing"

[project.urls]
Repository = "https://gitlab.com/andyrids/pkgdevx"
Issues = "https://gitlab.com/andyrids/pkgdevx/issues"
Changelog = "https://gitlab.com/andyrids/pkgdevx/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
version_scheme = "guess-next-dev"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.uv-cache",
]

[tool.hatch.build.targets.wheel]
exclude = [
  "/.uv-cache",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
log_cli = true
log_cli_level = "INFO"
tmp_path_retention_policy = "failed"

[tool.uv.workspace]
members = [
    "consumers/testing",
]
