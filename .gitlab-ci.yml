variables:
	DS_STATIC_REACHABILITY_ENABLED: true
	UV_CACHE_DIR: .uv-cache
	UV_LINK_MODE: copy
	UV_VERSION: "0.11.19"

# Include the GitLab managed templates
include:
  - template: Security/Container-Scanning.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.v2.gitlab-ci.yml
    inputs:
      enable_static_reachability: true

stages:
  - Lint
  - Test
  - Build
  - Scan

workflow:
	name: "$CI_COMMIT_TIMESTAMP $CI_PIPELINE_SOURCE $CI_COMMIT_REF_NAME"
  auto_cancel:
    on_new_commit: interruptible

# ---------------------------------------------------------
# Job Rules & Anchors
# ---------------------------------------------------------

.protected-mr-rules: &protected-mr-rules
  rules:
    # Runs for any merge request targeting a protected branch.
    # Excludes MRs to non-protected branches and direct pushes.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"'

.image-job-rules: &image-job-rules
  rules:
    # 1 & 2: MR from develop to main. 
    # NOTE: In GitLab, pushing a commit to 'develop' while this MR is active 
    # automatically triggers a new pipeline matching this exact rule.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "develop" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'
      variables:
        CS_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
    
    # 3: When develop is merged into main (Direct push/merge commit to main)
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      variables:
        CS_IMAGE: "$CI_REGISTRY_IMAGE:latest"
    
    # 4: When there is a tag
    - if: '$CI_COMMIT_TAG'

.image-tag: &image-tag
	before_script:
		- |
	    if [ -n "$CI_COMMIT_TAG" ]; then
		    export CS_IMAGE="$CI_REGISTRY_IMAGE:${CI_COMMIT_TAG#v}"
		  fi

# ---------------------------------------------------------
# Job Definitions
# ---------------------------------------------------------

.astral-uv:
	image:
    name: ghcr.io/astral-sh/uv:$UV_VERSION
    entrypoint: [""]
  cache:
	- key:
    files:
			- uv.lock
    paths:
			- $UV_CACHE_DIR
  before_script:
	  - uv sync
	after_script:
		- if [ "$CI_JOB_STATUS" == "canceled" ]; then exit 0; fi
		- uv cache prune --ci

ruff-lint-job:
	extends: .astral-uv
  stage: Lint
  interruptible: true
  <<: *protected-mr-rules
  script:
		- uv run ruff check .
		- uv run ruff format --check .

pytest-job:
	extends: .astral-uv
  stage: Test
  interruptible: true
  <<: *protected-mr-rules
  script:
		- uv run pytest --cov --cov-report term --cov-report xml:coverage.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
	artifacts:
		reports:
			coverage_report:
				coverage_format: cobertura
				path: coverage.xml

build-image-job:
	extends: .image-tag
  stage: build
  interruptible: true
  <<: *image-job-rules
  script:
		- echo "Executing multi-stage container build..."
		- make build-image

# Override the default rules of the included container_scanning job
container_scanning:
	extends: .image-tag
	stage: Scan
	needs: ["build-image-job"]
	interruptible: false
	<<: *image-job-rules
	variables:
		CS_DEFAULT_BRANCH_IMAGE: "$CI_REGISTRY_IMAGE:latest"