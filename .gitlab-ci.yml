variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy
  # UV_PUBLISH_INDEX: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi"
  UV_PUBLISH_URL: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/pypi"
  UV_PUBLISH_PASSWORD: "$CI_JOB_TOKEN"
  UV_PUBLISH_USERNAME: gitlab-ci-token
  UV_VERSION: 0.11.26-trixie
  GIT_DEPTH: 0

stages:
  - Lint
  - Test
  - Build
  - Scan
  - Publish

# ---------------------------------------------------------
# Workflow Customisation
# ---------------------------------------------------------

workflow:
  name: "$CI_COMMIT_TIMESTAMP $CI_PIPELINE_SOURCE $CI_COMMIT_REF_NAME"
  auto_cancel:
    on_new_commit: interruptible

# ---------------------------------------------------------
# Job Rules & Anchors
# ---------------------------------------------------------

.protected-branch-rules: &protected-branch-rules
  rules:
    # MR/push -> protected branch
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"'
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'

# ---------------------------------------------------------
# Job Definitions
# ---------------------------------------------------------

.astral-uv:
  image:
    name: ghcr.io/astral-sh/uv:$UV_VERSION
    # entrypoint: [""]
  cache:
  - key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PKGDEVX="${CI_COMMIT_TAG#v}"
      fi
    - git fetch --tags origin || true
    - uv sync
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
  after_script:
    - if [ "$CI_JOB_STATUS" == "canceled" ]; then exit 0; fi
    - uv cache prune --ci

ruff-lint-job:
  extends: .astral-uv
  stage: Lint
  interruptible: true
  <<: *protected-branch-rules
  script:
    - uv run pkgdevx-lint-hook
    - uv run pkgdevx-format-hook

pytest-job:
  extends: .astral-uv
  stage: Test
  interruptible: true
  <<: *protected-branch-rules
  script:
    - uv run coverage run -m pytest
    - uv run coverage report
    - uv run coverage xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

build-package-job:
  extends: .astral-uv
  stage: Build
  interruptible: true
  rules:
    - if: "$CI_COMMIT_TAG"
  script:
    - uv build --out-dir dist --package pkgdevx --verbose
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

publish-package-job:
  extends: .astral-uv
  stage: Publish
  interruptible: true
  needs:
    - job: build-package-job
      artifacts: true
  rules:
    - if: "$CI_COMMIT_TAG"
  # Skip .astral-uv `before_script`
  before_script: []
  script:
    - uv publish dist/*
